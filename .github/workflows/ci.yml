name: Verify study
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python scripts/test_pipeline.py
      - run: npm run build
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --project demo-diet-study --only firestore,auth "node scripts/seed_emulator.mjs && npm run test:browser"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: test-results, path: test-results/ }
